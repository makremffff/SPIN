<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mnd-ver" content="zhlytqvl715un2kphqebw" />
<title>لوج | تصفح إعلانات</title>
<style>
  :root{
    --bg: #0a0a0d;
    --bg-soft: #101014;
    --gold: #c6a15b;
    --gold-light: #e8d48b;
    --gold-dim: rgba(198,161,91,0.25);
    --text: #ece7da;
    --muted: #8b8578;
    --glass: rgba(255,255,255,0.035);
    --glass-border: rgba(198,161,91,0.18);
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Inter', sans-serif;
  }

  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ scroll-behavior:smooth; }

  body{
    background: radial-gradient(ellipse at top, #131318 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--font-body);
    min-height:100vh;
    line-height:1.6;
  }

  a{ color:inherit; text-decoration:none; }

  /* ===== Header ===== */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 22px 6vw;
    border-bottom: 1px solid rgba(198,161,91,0.1);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight:600;
    letter-spacing:0.5px;
    color: var(--gold-light);
  }

  .brand svg{ width:26px; height:26px; }

  nav a{
    color: var(--muted);
    font-size:0.92rem;
    margin-inline-start: 28px;
    transition: color .2s ease;
  }
  nav a:hover{ color: var(--gold-light); }

  /* ===== Hero ===== */
  .hero{
    padding: 8vh 6vw 6vh;
    text-align:center;
    max-width: 720px;
    margin: 0 auto;
  }

  .hero .eyebrow{
    color: var(--gold);
    font-size:0.85rem;
    margin-bottom: 18px;
    opacity:0.85;
  }

  .hero h1{
    font-family: var(--font-display);
    font-weight:700;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    line-height:1.25;
    color: var(--text);
  }

  .hero h1 span{
    color: var(--gold-light);
  }

  .hero p{
    margin-top: 18px;
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 520px;
    margin-inline: auto;
  }

  /* ===== Ad Section ===== */
  .ads-section{
    padding: 2vh 6vw 10vh;
    max-width: 1100px;
    margin: 0 auto;
  }

  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(198,161,91,0.12);
    padding-bottom: 14px;
  }

  .section-head h2{
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight:600;
    color: var(--gold-light);
  }

  .section-head span{
    color: var(--muted);
    font-size: 0.85rem;
  }

  .ad-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }

  .ad-slot{
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 20px;
    min-height: 180px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition: border-color .25s ease, transform .25s ease;
  }

  .ad-slot:hover{
    border-color: var(--gold-dim);
    transform: translateY(-3px);
  }

  .ad-slot .tag{
    display:flex;
    align-items:center;
    gap:8px;
    color: var(--muted);
    font-size: 0.78rem;
  }

  .ad-slot .tag svg{ width:15px; height:15px; stroke: var(--gold); }

  .ad-slot .placeholder{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    color: rgba(198,161,91,0.35);
    font-size: 0.85rem;
    border: 1px dashed rgba(198,161,91,0.2);
    border-radius: 10px;
    margin: 14px 0;
  }

  .ad-slot .open-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: #14120a;
    font-weight:600;
    font-size:0.88rem;
    padding: 10px;
    border-radius: 8px;
    cursor:pointer;
    border:none;
    transition: filter .2s ease;
  }
  .ad-slot .open-btn:hover{ filter: brightness(1.08); }
  .ad-slot .open-btn svg{ width:14px; height:14px; }

  /* Wide native banner slot */
  .ad-native{
    grid-column: 1 / -1;
    min-height: 120px;
  }

  /* ===== Footer ===== */
  footer{
    text-align:center;
    padding: 30px 6vw 40px;
    color: var(--muted);
    font-size: 0.82rem;
    border-top: 1px solid rgba(198,161,91,0.1);
  }

  footer .footer-gold{ color: var(--gold); }

  @media (max-width:560px){
    header{ padding: 18px 5vw; }
    nav a{ margin-inline-start: 16px; font-size:0.82rem; }
  }
</style>
</head>
