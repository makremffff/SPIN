<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ستة بيوت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { background: #0a0a0a; height: 100%; }
  body {
    min-height: 100vh;
    font-family: 'Tajawal', 'Cairo', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 0;
    padding-bottom: 16px;
    color: #eee;
  }

  /* ===== Top balance bar ===== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 10px 0 8px;
    background: linear-gradient(180deg, rgba(10,10,10,0.95), rgba(10,10,10,0.75));
    backdrop-filter: blur(6px);
  }
  .balance-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(212,175,55,0.45);
    border-radius: 999px;
    padding: 8px 18px;
    box-shadow: 0 0 18px rgba(212,175,55,0.12) inset;
  }
  .balance-pill .coin-ic {
    width: 22px; height: 22px;
    background-image: url(assets/coin-usdt.png);
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }
  .balance-pill .amount { font-weight: 900; font-size: 15px; color: #f3d778; letter-spacing: .3px; }
  .balance-pill .unit { font-size: 11px; color: #b9a15a; font-weight: 700; }

  /* ===== Six-house picker grid (selection only — no live battle inside) ===== */
  .boxes-wrap {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 12px;
    width: 92%;
    max-width: 460px;
    margin-top: 18px;
  }

  .box {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 2px dotted rgba(212, 175, 55, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
  }
  .box:active { border-color: #d4af37; background: rgba(212, 175, 55, 0.08); }
  .box.unlocked { border-style: solid; }
  .box.active { border-color: #f3d778; box-shadow: 0 0 14px rgba(212,175,55,.35) inset; }

  .box .house-thumb {
    height: 58%;
    filter: drop-shadow(0 4px 5px rgba(0,0,0,0.6));
  }
  .box.locked .house-thumb { filter: grayscale(1) brightness(.4) drop-shadow(0 4px 5px rgba(0,0,0,.6)); }

  .label {
    position: absolute;
    top: 4px; left: 0; right: 0;
    text-align: center;
    font-size: 9.5px; color: #f0e3b8; font-weight: 800;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
    pointer-events: none;
  }

  .box .lockbadge {
    position: absolute; top: 4px; left: 4px;
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,0.65); border: 1px solid rgba(212,175,55,.5);
    display: flex; align-items: center; justify-content: center;
  }
  .box .lockbadge svg { width: 10px; height: 10px; }
  .box .need {
    position: absolute; bottom: 12px; left: 4px; right: 4px;
    font-size: 8px; text-align: center; color: #a89452; font-weight: 700;
    line-height: 1.2;
  }
  .box .progress-track {
    position: absolute; bottom: 4px; left: 8px; right: 8px; height: 3px;
    background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden;
  }
  .box .progress-fill { height: 100%; background: linear-gradient(90deg,#d4af37,#f3d778); border-radius: 3px; }

  /* ===== Open battle stage — full width, stretches to the bottom of the screen ===== */
  .battle-stage {
    position: relative;
    width: 100%;
    flex: 1 1 auto;
    min-height: 280px;
    margin-top: 18px;
    overflow: hidden;
    border-top: 2px dotted rgba(212, 175, 55, 0.3);
  }
  .stage-ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 12%;
    background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.55));
  }
  /* ===== Fixed full-screen layer — bullets/fx travel here from the active box down to the stage ===== */
  #fxLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }

  .zombie {
    position: absolute;
    width: 52px;
    height: 52px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    z-index: 4;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.5));
  }
  .zombie.dying { animation: zdie .4s ease forwards; }
  @keyframes zdie { to { transform: scale(0.2) translateY(-4px); opacity: 0; } }

  .bullet {
    position: absolute;
    width: 20px; height: 20px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    z-index: 6;
    pointer-events: none;
  }

  .fx {
    position: absolute;
    width: 42px; height: 42px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    z-index: 7;
    pointer-events: none;
    transform: translate(-50%,-50%) scale(0.3);
    opacity: 0;
    animation: fxpop .6s ease-out forwards;
  }
  @keyframes fxpop {
    0%   { transform: translate(-50%,-50%) scale(0.2); opacity: 0; }
    30%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    70%  { opacity: 1; transform: translate(-50%,-50%) scale(1.25); }
    100% { transform: translate(-50%,-50%) scale(1.35); opacity: 0; }
  }

  .coin {
    position: absolute;
    width: 32px; height: 32px;
    background-image: url(assets/coin-usdt.png);
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    filter: drop-shadow(0 0 8px rgba(38,161,123,0.55));
    z-index: 8;
    animation: coinFloat 1.4s ease-in-out infinite;
    cursor: pointer;
  }
  @keyframes coinFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  .floattext {
    position: absolute;
    font-weight: 900;
    font-size: 12px;
    color: #f3d778;
    z-index: 9;
    pointer-events: none;
    animation: floatUp .9s ease-out forwards;
    text-shadow: 0 1px 3px rgba(0,0,0,.7);
    white-space: nowrap;
  }
  @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%,0); } 100% { opacity: 0; transform: translate(-50%,-34px); } }

  /* ===== toast ===== */
  .toast {
    position: fixed;
    bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(20,20,20,0.95);
    border: 1px solid rgba(212,175,55,0.5);
    color: #f0e3b8;
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    max-width: 88%;
    text-align: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    box-shadow: 0 6px 22px rgba(0,0,0,.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== House info modal ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0,0,0,0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-card {
    width: 100%;
    max-width: 340px;
    background: linear-gradient(180deg, rgba(28,24,14,0.98), rgba(12,11,8,0.98));
    border: 1px solid rgba(212,175,55,0.5);
    border-radius: 20px;
    padding: 20px 18px 18px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 24px rgba(212,175,55,0.12) inset;
    transform: scale(0.92);
    transition: transform .2s ease;
  }
  .modal-overlay.show .modal-card { transform: scale(1); }
  .modal-card .modal-house-img {
    height: 120px;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.6));
    margin-bottom: 6px;
  }
  .modal-card .modal-name { font-size: 17px; font-weight: 900; color: #f3d778; margin-bottom: 4px; }
  .modal-card .modal-status { font-size: 11.5px; font-weight: 700; margin-bottom: 12px; }
  .modal-card .modal-status.is-active { color: #7be08a; }
  .modal-card .modal-status.is-unlocked { color: #b9a15a; }
  .modal-card .modal-status.is-locked { color: #d17a7a; }
  .modal-card .modal-perk {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.6;
    color: #f0e3b8;
    margin-bottom: 14px;
  }
  .modal-card .modal-progress-track {
    height: 5px;
    border-radius: 5px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    margin-bottom: 14px;
  }
  .modal-card .modal-progress-fill { height: 100%; background: linear-gradient(90deg,#d4af37,#f3d778); border-radius: 5px; }
  .modal-card .modal-btn {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
  }
  .modal-card .modal-btn.primary { background: linear-gradient(90deg,#d4af37,#f3d778); color: #241c05; }
  .modal-card .modal-btn.disabled { background: rgba(255,255,255,0.08); color: #8a8a8a; cursor: default; }
  .modal-card .modal-close {
    margin-top: 10px;
    background: none;
    border: none;
    color: #a89452;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  /* ===== Share & wallet buttons — sit inside the topbar, so they scroll/stick with the balance ===== */
  .share-btn, .wallet-btn-icon {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 41;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(212,175,55,0.45);
    background: rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 14px rgba(212,175,55,0.15) inset;
  }
  .wallet-btn-icon { left: 14px; }
  .share-btn { right: 14px; }
  .share-btn:active, .wallet-btn-icon:active { border-color: #d4af37; background: rgba(212,175,55,0.12); }
  .share-btn svg, .wallet-btn-icon svg { width: 19px; height: 19px; }

  /* ===== Wallet full-screen page ===== */
  .wallet-page {
    position: fixed;
    inset: 0;
    z-index: 300;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform .25s ease;
  }
  html[dir="rtl"] .wallet-page { transform: translateX(-100%); }
  .wallet-page.show, html[dir="rtl"] .wallet-page.show { transform: translateX(0); }
  .wallet-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px 14px;
    border-bottom: 1px solid rgba(212,175,55,0.25);
    background: linear-gradient(180deg, rgba(212,175,55,0.06), transparent);
  }
  .wallet-back {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(212,175,55,0.4);
    background: rgba(255,255,255,0.05);
    color: #f3d778;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .wallet-title { font-size: 17px; font-weight: 900; color: #f3d778; letter-spacing: .2px; }
  .wallet-body {
    padding: 26px 20px 30px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    max-width: 380px;
    width: 100%;
    margin: 0 auto;
  }

  .wallet-balance-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: radial-gradient(120% 140% at 50% -20%, rgba(212,175,55,0.18), rgba(255,255,255,0.03) 60%);
    border: 1px solid rgba(212,175,55,0.35);
    border-radius: 18px;
    padding: 26px 16px 22px;
    overflow: hidden;
  }
  .wallet-balance-label { font-size: 11.5px; color: #a89452; font-weight: 700; position: relative; }
  .wallet-balance-row { display: flex; align-items: center; gap: 8px; position: relative; }
  .wallet-balance-row .coin-ic {
    width: 26px; height: 26px;
    background-image: url(assets/coin-usdt.png);
    background-size: contain; background-repeat: no-repeat; background-position: center;
  }
  .wallet-balance-amount { font-size: 28px; font-weight: 900; color: #f3d778; }
  .wallet-balance-row .unit { font-size: 12px; color: #a89452; font-weight: 700; }

  .wallet-divider { display: flex; align-items: center; gap: 10px; color: #a89452; font-size: 11.5px; font-weight: 700; }
  .wallet-divider::before, .wallet-divider::after { content: ''; flex: 1; height: 1px; background: rgba(212,175,55,0.25); }

  .wallet-field { display: flex; flex-direction: column; gap: 7px; }
  .wallet-field-label { font-size: 12px; color: #c9b06a; font-weight: 700; }
  .wallet-input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid rgba(212,175,55,0.4);
    background: rgba(255,255,255,0.04);
    color: #eee;
    font-family: inherit;
    font-size: 13px;
    transition: border-color .15s, background .15s;
  }
  .wallet-input:focus { outline: none; border-color: #d4af37; background: rgba(255,255,255,0.06); }
  .wallet-hint { font-size: 11.5px; color: #8a7638; }

  .wallet-actions { display: flex; flex-direction: column; gap: 10px; }
  .wallet-action-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
  }
  .wallet-action-btn .ic { font-size: 15px; line-height: 1; }
  .wallet-action-btn.primary { background: linear-gradient(90deg,#d4af37,#f3d778); color: #241c05; }
  .wallet-action-btn.primary:active { filter: brightness(0.95); }
  .wallet-action-btn.secondary { background: rgba(255,255,255,0.06); color: #f0e3b8; border: 1px solid rgba(212,175,55,0.3); }
  .wallet-action-btn.secondary:active { background: rgba(212,175,55,0.12); }
</style>
</head>

<script>
/* =========================================================
   ستة بيوت — شبكة اختيار (بدون معركة داخلها) + ساحة معركة مفتوحة واحدة
   تمتد لأسفل الشاشة، الزومبي يطلع من أسفلها والبيت النشط يطلق عليه
   ========================================================= */
/* ===================== نظام اللغة — يكتشف لغة المتصفح تلقائيًا (عربي/إنجليزي) ===================== */
const LANG = (navigator.language || navigator.userLanguage || 'ar').toLowerCase().startsWith('en') ? 'en' : 'ar';
document.documentElement.lang = LANG;
document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
document.title = LANG === 'ar' ? 'ستة بيوت' : 'Six Houses';

const I18N = {
  ar: {
    closeBtn: 'إغلاق',
    lockedBtn: 'غير متاح بعد',
    activeBtn: 'مفعّل الآن',
    activateBtn: 'تفعيل هذا البيت',
    statusActive: '✅ مفعّل حاليًا',
    statusUnlocked: '🔓 مفتوحة',
    statusLocked: (label, prog) => `🔒 مغلقة — تحتاج ${label} (${prog})`,
    unlockedToast: (name) => `🎉 تم فتح ${name}!`,
    oneReferral: 'إحالة واحدة',
    referralsN: (n) => `${n} إحالة`,
    adsN: (n) => `${n} إعلان`,
    depositN: (n) => `إيداع $${n}`,
    shareText: 'العب ستة بيوت واربح USDT حقيقي! 🏰🧟',
    walletTitle: 'المحفظة',
    walletBalanceLabel: 'الرصيد الحالي',
    walletDivider: 'طلب سحب',
    walletAddressLabel: 'عنوان محفظة TON',

function hName(house) { return house.name[LANG]; }
function hPerkDesc(house) { return house.perkDesc[LANG]; }

const ALL_ZOMBIE_TYPES = HOUSES.map(h => h.zombie);

const ZOMBIE_SPAWN_MS = 1900;
const ZOMBIE_SPEED = 0.012;
const TICK_MS = 60;
const FIRE_COOLDOWN_MS = 650;
const BULLET_TRAVEL_MS = 2200;
const COIN_VALUE = 0.005;
const COIN_INTERVAL_MS = 15000;

/* ===================== الحالة العامة (نموذج تجريبي محلي) ===================== */
const State = {
  balance: parseFloat(localStorage.getItem('sh_balance') || '0'),
  progress: JSON.parse(localStorage.getItem('sh_progress') || '{"referrals":0,"ads":0,"deposit":0}'),
  unlockedHouses: JSON.parse(localStorage.getItem('sh_unlocked') || '[1]'),
  activeHouseId: parseInt(localStorage.getItem('sh_active') || '1', 10),
};

function saveState() {
  localStorage.setItem('sh_balance', State.balance.toFixed(6));
  localStorage.setItem('sh_progress', JSON.stringify(State.progress));
  localStorage.setItem('sh_unlocked', JSON.stringify(State.unlockedHouses));
  localStorage.setItem('sh_active', String(State.activeHouseId));
}

function isUnlocked(house) { return house.unlocked || State.unlockedHouses.includes(house.id); }

function unlockProgressFor(house) {
  if (!house.unlock) return { have: 1, need: 1 };
  const { type, need } = house.unlock;
  if (type === 'referrals') return { have: State.progress.referrals, need };
  if (type === 'ads')       return { have: State.progress.ads, need };
  if (type === 'deposit')   return { have: State.progress.deposit, need };
  return { have: 0, need: 1 };
}

function unlockLabel(house) {
  if (!house.unlock) return '';
  const { type, need } = house.unlock;
  if (type === 'referrals') return need === 1 ? T.oneReferral : T.referralsN(need);
  if (type === 'ads')       return T.adsN(need);
  if (type === 'deposit')   return T.depositN(need);
  return '';
}

function checkUnlocks() {
  let changed = false;
  HOUSES.forEach(h => {
    if (h.unlocked || State.unlockedHouses.includes(h.id)) return;
    const p = unlockProgressFor(h);
    if (p.have >= p.need) {
      State.unlockedHouses.push(h.id);
      changed = true;
      showToast(T.unlockedToast(hName(h)));
    }
  });
  if (changed) { saveState(); renderBoxes(); }
}

function renderBalance() {
  document.getElementById('balanceAmount').textContent = State.balance.toFixed(4);
  const w = document.getElementById('walletBalanceAmount');
  if (w) w.textContent = State.balance.toFixed(4);
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ===================== شبكة اختيار البيوت (بدون معركة داخلها) ===================== */
const boxThumbEls = {}; // houseId -> the house-thumb <img> element, used as the firing point
function renderBoxes() {
  const wrap = document.getElementById('boxesWrap');
  wrap.innerHTML = '';
  HOUSES.forEach(house => {
    const unlocked = isUnlocked(house);
    const box = document.createElement('div');
    box.className = 'box' + (unlocked ? ' unlocked' : ' locked') + (house.id === State.activeHouseId ? ' active' : '');

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = hName(house);
    box.appendChild(label);

    const thumb = document.createElement('img');
    thumb.className = 'house-thumb';
    thumb.src = house.img;
    box.appendChild(thumb);
    boxThumbEls[house.id] = thumb;

    if (!unlocked) {
      const badge = document.createElement('div');
      badge.className = 'lockbadge';
      badge.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 10V8a6 6 0 1 1 12 0v2" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/><rect x="4" y="10" width="16" height="10" rx="2" stroke="#d4af37" stroke-width="2"/></svg>';
      box.appendChild(badge);

      const p = unlockProgressFor(house);
      const need = document.createElement('div');
      need.className = 'need';
      need.textContent = unlockLabel(house);
      box.appendChild(need);

      const track = document.createElement('div');
      track.className = 'progress-track';
      const fill = document.createElement('div');
      fill.className = 'progress-fill';
      fill.style.width = Math.min(100, (p.have / p.need) * 100) + '%';
      track.appendChild(fill);
      box.appendChild(track);
    }

    box.addEventListener('click', () => openHouseModal(house));
    wrap.appendChild(box);
  });
}

function activateHouse(house) {
  if (house.id === State.activeHouseId) return;
  stopBattle();
  State.activeHouseId = house.id;
  saveState();
  renderBoxes();
  startBattle(house);
}

function formatProgress(p, type) {
  if (type === 'deposit') return `$${p.have.toFixed(3)} / $${p.need}`;
  return `${p.have} / ${p.need}`;
}

/* ===================== نافذة معلومات البيت (تظهر وسط الشاشة عند الضغط) ===================== */

const modalPerk = document.getElementById('modalPerk');

const modalProgressFill = document.getElementById('modalProgressFill');

function openHouseModal(house) {

/* ===================== ساحة المعركة المفتوحة (أسفل الشاشة) ===================== */
const stage = document.getElementById('battleStage');
const fxLayer = document.getElementById('fxLayer');
const zombieSound = document.getElementById('zombieSound');
let zombies = [];
let lastFire = 0;
let bulletActive = false;

function playZombieSound() {
  const snd = zombieSound.cloneNode(true);
  snd.volume = 0.5;
  snd.play().catch(() => {});
}

function spawnZombie(house) {
  const rect = stage.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'zombie';
  const zombieSprite = ALL_ZOMBIE_TYPES[Math.floor(Math.random() * ALL_ZOMBIE_TYPES.length)];
  el.style.backgroundImage = `url(${zombieSprite})`;
  const laneX = 10 + Math.random() * (rect.width - 62);
  el.style.left = laneX + 'px';
  el.style.bottom = '0px';
  stage.appendChild(el);
  zombies.push({ el, x: laneX, progress: 0, alive: true });
  playZombieSound();
}

/* نقطة الإطلاق = مكان البيت النشط الفعلي داخل شبكة الاختيار (لا بيت ثاني بالساحة) */
function muzzlePoint(house) {
  const thumb = boxThumbEls[house.id];
  const r = thumb.getBoundingClientRect();
  return {
    x: r.left + r.width / 2,
    y: r.top + r.height * 0.2,
  };
}

function fireAt(house, zombie) {
  bulletActive = true;
  const muzzle = muzzlePoint(house);
  let x = muzzle.x, y = muzzle.y;

  const zRect0 = zombie.el.getBoundingClientRect();
  const initDist = Math.hypot(
    (zRect0.left + zRect0.width / 2) - x,
    (zRect0.top + zRect0.height * 0.3) - y
  ) || 1;
  const speed = initDist / BULLET_TRAVEL_MS; // px/ms — كل الطلقات تاخذ نفس المدة تقريبًا بغض النظر عن المسافة

  const bullet = document.createElement('div');
  bullet.className = 'bullet';
  bullet.style.backgroundImage = `url(${house.bullet})`;
  bullet.style.left = x + 'px';
  bullet.style.top = y + 'px';
  fxLayer.appendChild(bullet);

  let last = performance.now();
  function step(now) {
    if (!zombie.alive) { bullet.remove(); bulletActive = false; return; }
    const dt = now - last;
    last = now;
    const zRect = zombie.el.getBoundingClientRect();
    const tx = zRect.left + zRect.width / 2;
    const ty = zRect.top + zRect.height * 0.3;
    const dx = tx - x, dy = ty - y;
    const dist = Math.hypot(dx, dy);
    const angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
    bullet.style.transform = `translate(-50%,-50%) rotate(${angle}deg)`;

    if (dist < 16) {
      bullet.remove();
      explodeAt(house, tx, ty);
      killZombie(zombie, house);
      bulletActive = false;
      return;
    }
    const move = Math.min(dist, speed * dt);
    x += (dx / dist) * move;
    y += (dy / dist) * move;
    bullet.style.left = x + 'px';
    bullet.style.top = y + 'px';
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function explodeAt(house, x, y) {
  const fx = document.createElement('div');
  fx.className = 'fx';
  fx.style.backgroundImage = `url(${house.fx})`;
  fx.style.left = x + 'px';
  fx.style.top = y + 'px';
  fxLayer.appendChild(fx);
  setTimeout(() => fx.remove(), 620);
}

function killZombie(zombie, house) {
  if (!zombie.alive) return;
  zombie.alive = false;
  zombie.el.classList.add('dying');
  if (house && house.perk && house.perk.type === 'killBonus' && Math.random() < house.perk.chance) {
    const sRect = stage.getBoundingClientRect();
    const zRect = zombie.el.getBoundingClientRect();
    const relX = zRect.left - sRect.left + zRect.width / 2;
    const relY = zRect.top - sRect.top;
    addBalance(currentCoinValue(), relX, relY);
  }
  setTimeout(() => zombie.el.remove(), 400);
  zombies = zombies.filter(z => z !== zombie);
}

/* ===================== عملات الرصيد داخل الساحة ===================== */
let currentCoinEl = null;

function currentCoinValue() {
  const h = HOUSES.find(x => x.id === State.activeHouseId);
  if (h && h.perk && h.perk.type === 'coinValue') return COIN_VALUE * h.perk.multiplier;
  return COIN_VALUE;
}

function spawnCoin() {
  if (currentCoinEl) { currentCoinEl.remove(); currentCoinEl = null; }
  const rect = stage.getBoundingClientRect();
  const coin = document.createElement('div');
  coin.className = 'coin';
  const cx = 12 + Math.random() * (rect.width - 40);
  const cy = 14 + Math.random() * (rect.height * 0.4);
  coin.style.left = cx + 'px';
  coin.style.top = cy + 'px';
  coin.addEventListener('click', (e) => {
    e.stopPropagation();
    addBalance(currentCoinValue(), cx + 14, cy);
    coin.remove();
    if (currentCoinEl === coin) currentCoinEl = null;
  });
  stage.appendChild(coin);
  currentCoinEl = coin;
}

function addBalance(amount, x, y) {
  State.balance += amount;
  saveState();
  renderBalance();
  spawnFloatText(x, y, `+${amount.toFixed(3)}$`);
}

function spawnFloatText(x, y, text) {
  const t = document.createElement('div');
  t.className = 'floattext';
  t.textContent = text;
  t.style.left = x + 'px';
  t.style.top = y + 'px';
  stage.appendChild(t);
  setTimeout(() => t.remove(), 900);
}

function gameTick(house) {
  const rect = stage.getBoundingClientRect();
  zombies.forEach(z => {
    if (!z.alive) return;
    z.progress = Math.min(1, z.progress + ZOMBIE_SPEED);
    const bottom = z.progress * (rect.height * 0.78);
    z.el.style.bottom = bottom + 'px';
    if (z.progress >= 1) killZombie(z, house);
  });

  const now = performance.now();
  if (!bulletActive && zombies.length && now - lastFire > FIRE_COOLDOWN_MS) {
    const target = zombies.reduce((a, b) => (a.progress > b.progress ? a : b));
    fireAt(house, target);
    lastFire = now;
  }
}

let battleTimers = [];
function startBattle(house) {
  stopBattle();
  const spawnT = setInterval(() => spawnZombie(house), ZOMBIE_SPAWN_MS);
  const tickT = setInterval(() => gameTick(house), TICK_MS);
  const coinInterval = (house.perk && house.perk.type === 'coinRate') ? house.perk.intervalMs : COIN_INTERVAL_MS;
  const coinT = setInterval(spawnCoin, coinInterval);
  const firstCoin = setTimeout(spawnCoin, 2000);
  battleTimers = [spawnT, tickT, coinT, firstCoin];

  if (house.perk && house.perk.type === 'passive') {
    const passiveT = setInterval(() => {
      const rect = stage.getBoundingClientRect();
      addBalance(house.perk.amount, rect.width / 2, 26);
    }, house.perk.intervalMs);
    battleTimers.push(passiveT);
  }
}

function stopBattle() {
  battleTimers.forEach(t => { clearInterval(t); clearTimeout(t); });
  battleTimers = [];
  zombies.forEach(z => { z.alive = false; z.el.remove(); });
  zombies = [];
  bulletActive = false;
  if (currentCoinEl) { currentCoinEl.remove(); currentCoinEl = null; }
}

/* ===================== تشغيل اللعبة ===================== */
renderBalance();
renderBoxes();
checkUnlocks();
const activeHouse = HOUSES.find(h => h.id === State.activeHouseId) || HOUSES[0];
startBattle(activeHouse);

   نقاط ربط لاحقة بالباك إند الحقيقي:
   - State.progress.referrals / ads / deposit ← تحدَّث من السيرفر الحقيقي
   - State.balance ← يُزامن مع رصيد المستخدم في قاعدة البيانات
   بعد أي تحديث حقيقي: نادِ checkUnlocks() و saveState() و renderBalance()
   ========================================================= */
</script>

<div class="ad-static-bottom" style="display:flex;flex-direction:column;align-items:center;gap:4px;">
  <div id="adBottom1" style="width:320px;height:50px;"></div>
  <div id="adBottom2" style="width:320px;height:50px;"></div>
  <div id="adBottom3" style="width:320px;height:50px;"></div>
</div>

<script>
/* ===================== محرّك تشغيل إعلانات 320×50 ===================== */
function renderAdSlot(containerId, key) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';
  const iframe = document.createElement('iframe');
  iframe.style.width = '320px';
  iframe.style.height = '50px';
  iframe.style.border = '0';
  iframe.style.overflow = 'hidden';
  iframe.scrolling = 'no';
  container.appendChild(iframe);
  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(
    '<script>atOptions = {"key":"' + key + '","format":"iframe","height":50,"width":320,"params":{}};<\/script>' +
    '<script src="https://interventioncopiedloitering.com/' + key + '/invoke.js"><\/script>'
  );
  doc.close();
}

/* الأكواد الثابتة (أعلى + أسفل) */
const AD_TOP_KEYS = [
  'b895987c82805b8778a34f54911e8de0',
  'ab4615d3d759a81e9b876abbcebaf690',
  '3b49398bb9242d548c0464f244b621fa'
];
const AD_BOTTOM_INITIAL_KEYS = [
  'b3570e82f7fb6c462dfdfded816f1576',
  'de29a44d70992e967ae5d20275e77fab',
  '280eab7c354ed87595a376b2f5e270cb'
];
/* الأكواد المتبقية — تُستخدم في تحديث الثلاثة النشطين أسفل الصفحة كل 5 ثواني عشوائيًا */
const AD_ROTATE_POOL = [
  'd47f719464108005a03a03e6d49fba1a',
  '04bcf6532017b6790ab2ddac95a5621d',
  '8c0574e870e5a3843e89d947bd38aaff',
  '9f6fe4084cb3d8a8eb4d8246ee57ed25'
];

const AD_TOP_IDS = ['adTop1', 'adTop2', 'adTop3'];
const AD_BOTTOM_IDS = ['adBottom1', 'adBottom2', 'adBottom3'];
const AD_ACTIVE_IDS = AD_TOP_IDS.concat(AD_BOTTOM_IDS);

function randomAdKey() {
  return AD_ROTATE_POOL[Math.floor(Math.random() * AD_ROTATE_POOL.length)];
}

/* تحميل أولي */
AD_TOP_IDS.forEach((id, i) => renderAdSlot(id, AD_TOP_KEYS[i]));
AD_BOTTOM_IDS.forEach((id, i) => renderAdSlot(id, AD_BOTTOM_INITIAL_KEYS[i]));

/* تحديث الستة (فوق وتحت) كل 5 ثواني بشكل عشوائي */
setInterval(() => {
  AD_ACTIVE_IDS.forEach(id => renderAdSlot(id, randomAdKey()));
}, 5000);
</script>
</body>
</html>
